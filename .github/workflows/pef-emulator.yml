name: PEF Emulator Smoke
on:
  push:
    branches: [main]
    paths:
      - 'src/emulator/**'
      - 'src/core/**'
      - 'src/runtime/**'
      - 'src/adapters/**'
      - 'src/workloads/**'
      - 'public/**'
      - 'bin/**'
      - 'test/**'
      - 'scenarios/**'
      - 'package.json'
      - 'scripts/lab/**'
      - 'ops/systemd/**'
      - 'scripts/arm64-vm/**'
      - 'docs/contracts/**'
      - '.github/workflows/pef-emulator.yml'
  workflow_dispatch:
    inputs:
      m1_video:
        description: 'Record M1 evidence video for this run'
        required: false
        type: boolean
        default: false
      m3_video:
        description: 'Record same-run M3 evidence WebM (opt-in)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser client syntax check
        run: node --check public/dashboard.js
      - name: Node regression suite
        run: npm test
      - name: M4.3 dual-overlay commonality and fault evidence (lab only)
        run: |
          node bin/pef-m4-commonality.js > "$RUNNER_TEMP/pef-m4-commonality.json"
          node -e 'const r=require(process.argv[1]);if(!r.ok||r.status!=="LAB_PASS"||r.hardwareValidated!==false||r.profiles.property.runtime.status!=="LAB_PASS"||r.profiles.host.runtime.status!=="LAB_PASS")process.exit(1)' "$RUNNER_TEMP/pef-m4-commonality.json"
          node -e 'const r=require(process.argv[1]);console.log("M4_MEASURED="+JSON.stringify({source:r.source,property:r.profiles.property.runtime.observedMetrics,host:r.profiles.host.runtime.observedMetrics}))' "$RUNNER_TEMP/pef-m4-commonality.json"
      - name: Upload M4.3 measured source/resources and failure matrix
        uses: actions/upload-artifact@v4
        with:
          name: m4-commonality-lab-${{ github.run_id }}
          path: ${{ runner.temp }}/pef-m4-commonality.json
          if-no-files-found: error
      - name: M4.4 integrated Property Host failure matrix SHA256 bundle
        run: |
          npm run m4:bundle -- --output-root artifacts/m4-ci
          bundle="$(find artifacts/m4-ci -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$bundle"
          npm run m4:bundle:verify -- "$bundle"
      - name: Upload M4.4 same-run verified evidence (x64 lab-only)
        uses: actions/upload-artifact@v4
        with:
          name: m4-integrated-evidence-x64
          path: artifacts/m4-ci
          if-no-files-found: error
      - name: M5.1–M5.2 unprivileged Linux x64 packaged Edge install upgrade rollback
        run: npm run m5:linux > "$RUNNER_TEMP/pef-m5-x64.json"
      - name: Upload M5 Linux x64 installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-install-x64-lab
          path: ${{ runner.temp }}/pef-m5-x64.json
          if-no-files-found: error
      - name: Pre-device port contract rehearsal
        run: npm run ports:conformance -- --output "$RUNNER_TEMP/pef-predevice-ports.json"
      - name: Upload predevice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-predevice-ports
          path: ${{ runner.temp }}/pef-predevice-ports.json
          if-no-files-found: warn
      - name: Canonical Core golden traces on Linux runner
        run: npm run traces:check -- --output "$RUNNER_TEMP/pef-golden-traces-linux.json"
      - name: Upload golden trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-golden-traces-linux
          path: ${{ runner.temp }}/pef-golden-traces-linux.json
          if-no-files-found: warn
      - name: C1 safe pre-device boot and provisioning preflight
        run: npm run device:preflight -- --output "$RUNNER_TEMP/pef-device-preflight.json"
      - name: Upload C1 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-device-preflight
          path: ${{ runner.temp }}/pef-device-preflight.json
          if-no-files-found: warn
      - name: C2 hardware candidates and read-only CI host observation
        run: npm run device:candidates -- --output "$RUNNER_TEMP/pef-c2-candidates.json"
      - name: Upload C2 candidate screening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-c2-hardware-screening
          path: ${{ runner.temp }}/pef-c2-candidates.json
          if-no-files-found: warn
      - name: M1 canonical headless evidence from real autonomous daemon
        run: |
          npm run m1:evidence -- --output-root "$RUNNER_TEMP/pef-m1"
          bundle="$(find "$RUNNER_TEMP/pef-m1" -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$bundle"
          npm run m1:evidence:verify -- "$bundle"
      - name: Upload M1 evidence; source is autonomous OS journal, Cloud mocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-technical-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/pef-m1
          if-no-files-found: error
      - name: M3 actual headless restart and durable receipt evidence
        run: npm run m3:evidence -- --output "$RUNNER_TEMP/pef-m3-lifecycle.json"
      - name: Upload M3 headless lifecycle evidence (software lab only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-autonomous-lifecycle-${{ github.run_id }}
          path: ${{ runner.temp }}/pef-m3-lifecycle.json
          if-no-files-found: error
      - name: M3 transactional revision, fail-closed rollback and safe-mode evidence
        run: npm run m3:recovery -- --output "$RUNNER_TEMP/pef-m3-recovery.json"
      - name: Upload M3 configuration / safe-mode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-transactional-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/pef-m3-recovery.json
          if-no-files-found: error
      - name: M3.5/M3.6 single-run technical proof and independent verifier
        run: |
          npm run m3:bundle -- --output-root "$RUNNER_TEMP/pef-m3-operations"
          bundle="$(find "$RUNNER_TEMP/pef-m3-operations" -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$bundle"
          npm run m3:bundle:verify -- "$bundle"
      - name: Upload M3 operations evidence (software lab, no video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-operations-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/pef-m3-operations
          if-no-files-found: error
      - name: Deterministic scenarios
        run: npm run emulate
      - name: Loopback connectivity lab
        run: npm run lab:loopback

  arm64-isa:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup native ARM64 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ARM64 guest shell syntax check (no kernel operations on CI)
        run: bash -n scripts/arm64-vm/lima.sh scripts/arm64-vm/guest-run.sh scripts/arm64-vm/guest-network-lab.sh scripts/arm64-vm/guest-d3.sh scripts/arm64-vm/guest-load.sh scripts/arm64-vm/guest-compare.sh scripts/arm64-vm/guest-e1-e2.sh scripts/arm64-vm/guest-e5.sh scripts/arm64-vm/guest-f1-f2.sh
      - name: ARM64 Core test suite
        run: npm test
      - name: M4.4 ARM64 integrated lab-only bundle and SHA256 verification
        run: |
          npm run m4:bundle -- --output-root artifacts/m4-arm64-ci
          bundle="$(find artifacts/m4-arm64-ci -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$bundle"
          npm run m4:bundle:verify -- "$bundle"
      - name: Upload M4.4 native ARM64 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m4-integrated-evidence-arm64
          path: artifacts/m4-arm64-ci
          if-no-files-found: error
      - name: M5.2 native ARM64 non-privileged release/process lifecycle
        run: npm run m5:linux > "$RUNNER_TEMP/pef-m5-arm64.json"
      - name: Upload M5 ARM64 install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-install-arm64-lab
          path: ${{ runner.temp }}/pef-m5-arm64.json
          if-no-files-found: error
      - name: ARM64 ISA golden parity and journal
        run: |
          mkdir -p "$RUNNER_TEMP/pef-arm64-data"
          npm run arm64:profile -- --profile r28s-1g --require-arm64 \
            --base-dir "$RUNNER_TEMP/pef-arm64-data" --output "$RUNNER_TEMP/pef-arm64-isa.json"
      - name: Upload ARM64 evidence (not constrained 1GiB guest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-arm64-isa-unconstrained
          path: ${{ runner.temp }}/pef-arm64-isa.json
          if-no-files-found: warn

      - name: D4 bounded 2000-receipt ARM64 load (no 1GiB memory cap)
        run: |
          npm run arm64:profile -- --profile r28s-1g --count 2000 --require-arm64 \
            --base-dir "$RUNNER_TEMP/pef-arm64-data" --output "$RUNNER_TEMP/pef-arm64-load-unconstrained.json"
      - name: Upload D4 ARM64 load evidence (not memory-constrained)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-arm64-2k-load-no-memory-cap
          path: ${{ runner.temp }}/pef-arm64-load-unconstrained.json
          if-no-files-found: warn
      - name: E1 read-only ARM64 guest resource observation (CI RAM not constrained)
        run: node bin/pef-arm64-e1.js --profile r28s-1g --output "$RUNNER_TEMP/pef-e1-guest-ci.json"
      - name: E2 bounded ARM64 fsync/reopen and 72h capacity projection
        run: |
          node bin/pef-arm64-e2.js --profile r28s-1g --count 1200 --payload-kib 1 \
            --base-dir "$RUNNER_TEMP/pef-arm64-data" --output "$RUNNER_TEMP/pef-e2-bounded-ci.json"
      - name: F1 staged journal index smoke (NOT constrained to 1 GiB)
        run: node bin/pef-arm64-f1.js --mode smoke --profile r28s-1g --base-dir "$RUNNER_TEMP/pef-arm64-data" --output "$RUNNER_TEMP/pef-f1-smoke.json"
      - name: E2 additional 4KiB sample for F2 projection
        run: |
          node bin/pef-arm64-e2.js --profile r28s-1g --count 800 --payload-kib 4 \
            --base-dir "$RUNNER_TEMP/pef-arm64-data" --output "$RUNNER_TEMP/pef-e2-4k-ci.json"
      - name: F2 project 72h data and expose product 100MiB gap (NOT proven retention)
        run: |
          node bin/pef-arm64-f2.js --profile r28s-1g \
            --f1 "$RUNNER_TEMP/pef-f1-smoke.json" \
            --e2-small "$RUNNER_TEMP/pef-e2-bounded-ci.json" \
            --e2-large "$RUNNER_TEMP/pef-e2-4k-ci.json" \
            --output "$RUNNER_TEMP/pef-f2-projection.json"
      - name: F1/F2 ARM64 CI artifacts, no 1GiB or 72h certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-f1-f2-arm64-ci-unconstrained
          path: |
            ${{ runner.temp }}/pef-f1-smoke.json
            ${{ runner.temp }}/pef-e2-4k-ci.json
            ${{ runner.temp }}/pef-f2-projection.json
          if-no-files-found: warn
      - name: Upload E1-E2 ARM64 evidence (CI not 1GiB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-e1-e2-arm64-ci-unconstrained
          path: |
            ${{ runner.temp }}/pef-e1-guest-ci.json
            ${{ runner.temp }}/pef-e2-bounded-ci.json
          if-no-files-found: warn

  netns-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node for policy driver
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight networking tools
        run: |
          if ! command -v ip >/dev/null || ! command -v ping >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y iproute2 iputils-ping
          fi
      - name: Inspect Linux workload isolation prerequisites (read-only)
        run: |
          echo "PEF_S3_CGROUP_FS=$(stat -f -c %T /sys/fs/cgroup 2>/dev/null || echo missing)"
          echo "PEF_S3_CONTROLLERS=$(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo unavailable)"
          echo "PEF_S3_SUBTREE=$(cat /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || echo unavailable)"
          echo "PEF_S3_MOUNT=$(findmnt -n -o OPTIONS /sys/fs/cgroup 2>/dev/null || echo unavailable)"
          echo "PEF_S3_UNSHARE=$(command -v unshare || echo unavailable)"
          echo "PEF_S3_PRLIMIT=$(command -v prlimit || echo unavailable)"
      - name: Isolated Linux namespace network routing
        env:
          PEF_NETNS_ACK: GITHUB_HOSTED_EPHEMERAL_ONLY
        run: |
          sudo -n env CI="$CI" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            PEF_NETNS_ACK="$PEF_NETNS_ACK" PEF_NETNS_REPO_ROOT="$GITHUB_WORKSPACE" \
            PEF_NETNS_NODE="$(command -v node)" \
            PEF_NETNS_EVIDENCE="$RUNNER_TEMP/pef-netns-evidence.json" \
            PEF_NETNS_POLICY_EVIDENCE="$RUNNER_TEMP/pef-netns-policy.json" \
            bash scripts/lab/netns-smoke.sh
      - name: S3 cgroup and namespace workload isolation (ephemeral Linux)
        env:
          PEF_S3_ACK: GITHUB_HOSTED_EPHEMERAL_ONLY
        run: |
          sudo -n env CI="$CI" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            PEF_S3_ACK="$PEF_S3_ACK" PEF_S3_REPO_ROOT="$GITHUB_WORKSPACE" \
            PEF_S3_NODE="$(command -v node)" \
            PEF_S3_EVIDENCE="$RUNNER_TEMP/pef-s3-evidence.json" PEF_S34_EVIDENCE="$RUNNER_TEMP/pef-s34-evidence.json" PEF_M55_EVIDENCE="$RUNNER_TEMP/pef-m55-evidence.json" \
            bash scripts/lab/workload-isolation-smoke.sh
      - name: Upload lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-netns-evidence
          path: |
            ${{ runner.temp }}/pef-netns-*.json
            ${{ runner.temp }}/pef-s3-evidence.json
            ${{ runner.temp }}/pef-s34-evidence.json
            ${{ runner.temp }}/pef-m55-evidence.json
          if-no-files-found: warn

  m54-systemd-lab:
    name: M5.4 systemd service lifecycle (ephemeral Linux only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M5.4 run real systemd on GitHub-hosted VM (not an OS reboot)
        env:
          PEF_M54_ACK: GITHUB_HOSTED_EPHEMERAL_ONLY
        run: |
          sudo -n env CI="$CI" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            PEF_M54_ACK="$PEF_M54_ACK" SUDO_USER="$(whoami)" \
            PEF_M54_EVIDENCE="$RUNNER_TEMP/pef-m54-systemd.json" \
            PATH="$PATH" bash scripts/lab/m5-systemd-smoke.sh
      - name: Upload M5.4 systemd evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-m54-systemd-ci
          path: ${{ runner.temp }}/pef-m54-systemd.json
          if-no-files-found: error

  prehardware-gate:
    name: Pre-hardware software handoff
    if: always()
    needs: [emulator, netns-lab]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download actual Linux lab artifacts
        if: ${{ needs.netns-lab.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pef-netns-evidence
          path: ${{ runner.temp }}/pef-lab-evidence
      - name: Evaluate fail-closed pre-hardware handoff
        env:
          PEF_EMULATOR_RESULT: ${{ needs.emulator.result }}
          PEF_LINUX_RESULT: ${{ needs.netns-lab.result }}
          PEF_LAB_EVIDENCE_DIR: ${{ runner.temp }}/pef-lab-evidence
        run: node bin/pef-prehardware-gate.js --output "$RUNNER_TEMP/pef-prehardware-gate.json"
      - name: Upload handoff verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-prehardware-gate
          path: ${{ runner.temp }}/pef-prehardware-gate.json
          if-no-files-found: warn

  m1-video-milestone:
    # Browser only on explicit workflow dispatch or milestone commit.
    if: (github.event_name == 'workflow_dispatch' && inputs.m1_video == true) || contains(github.event.head_commit.message, '[m1-video]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned optional Playwright library
        run: npm install --no-audit --no-fund
      - name: Install browser only in opt-in milestone job
        run: npx playwright install --with-deps chromium
      - name: Produce real standalone M1 evidence and verify
        run: |
          npm run m1:evidence -- --output-root "$RUNNER_TEMP/pef-m1"
          bundle="$(find "$RUNNER_TEMP/pef-m1" -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$bundle"
          npm run m1:evidence:verify -- "$bundle"
          echo "M1_BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Record evidence-derived WebM and verify source runId + digest
        run: |
          npm run m1:evidence:video -- --dir "$M1_BUNDLE"
          npm run m1:evidence:verify-video -- "$M1_BUNDLE"
      - name: Upload single-run report, HTML, trace and WebM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-e2e-video-${{ github.run_id }}
          path: ${{ runner.temp }}/pef-m1
          if-no-files-found: error

  m3-video-milestone:
    if: (github.event_name == 'workflow_dispatch' && inputs.m3_video == true) || contains(github.event.head_commit.message, '[m3-video]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium only on milestone
        run: npx playwright install --with-deps chromium
      - name: Produce and verify real M3 operation evidence
        run: |
          npm run m3:bundle -- --output-root "$RUNNER_TEMP/pef-m3-video"
          bundle="$(find "$RUNNER_TEMP/pef-m3-video" -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$bundle"
          npm run m3:bundle:verify -- "$bundle"
          echo "M3_BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: Record same-run HTML-derived WebM
        run: |
          npm run m3:bundle:video -- "$M3_BUNDLE"
          npm run m3:bundle:verify-video -- "$M3_BUNDLE"
      - name: Upload M3 report, trace and WebM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-operations-video-${{ github.run_id }}
          path: ${{ runner.temp }}/pef-m3-video
          if-no-files-found: error
