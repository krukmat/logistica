name: PEF Emulator Smoke
on:
  push:
    branches: [main]
    paths:
      - 'src/emulator/**'
      - 'src/core/**'
      - 'src/runtime/**'
      - 'src/adapters/**'
      - 'src/workloads/**'
      - 'public/**'
      - 'bin/**'
      - 'test/**'
      - 'scenarios/**'
      - 'package.json'
      - 'scripts/lab/**'
      - 'docs/contracts/**'
      - '.github/workflows/pef-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser client syntax check
        run: node --check public/dashboard.js
      - name: Node regression suite
        run: npm test
      - name: Pre-device port contract rehearsal
        run: npm run ports:conformance -- --output "$RUNNER_TEMP/pef-predevice-ports.json"
      - name: Upload predevice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-predevice-ports
          path: ${{ runner.temp }}/pef-predevice-ports.json
          if-no-files-found: warn
      - name: Canonical Core golden traces on Linux runner
        run: npm run traces:check -- --output "$RUNNER_TEMP/pef-golden-traces-linux.json"
      - name: Upload golden trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-golden-traces-linux
          path: ${{ runner.temp }}/pef-golden-traces-linux.json
          if-no-files-found: warn
      - name: C1 safe pre-device boot and provisioning preflight
        run: npm run device:preflight -- --output "$RUNNER_TEMP/pef-device-preflight.json"
      - name: Upload C1 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-device-preflight
          path: ${{ runner.temp }}/pef-device-preflight.json
          if-no-files-found: warn
      - name: Deterministic scenarios
        run: npm run emulate
      - name: Loopback connectivity lab
        run: npm run lab:loopback

  netns-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node for policy driver
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight networking tools
        run: |
          if ! command -v ip >/dev/null || ! command -v ping >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y iproute2 iputils-ping
          fi
      - name: Inspect Linux workload isolation prerequisites (read-only)
        run: |
          echo "PEF_S3_CGROUP_FS=$(stat -f -c %T /sys/fs/cgroup 2>/dev/null || echo missing)"
          echo "PEF_S3_CONTROLLERS=$(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo unavailable)"
          echo "PEF_S3_SUBTREE=$(cat /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || echo unavailable)"
          echo "PEF_S3_MOUNT=$(findmnt -n -o OPTIONS /sys/fs/cgroup 2>/dev/null || echo unavailable)"
          echo "PEF_S3_UNSHARE=$(command -v unshare || echo unavailable)"
          echo "PEF_S3_PRLIMIT=$(command -v prlimit || echo unavailable)"
      - name: Isolated Linux namespace network routing
        env:
          PEF_NETNS_ACK: GITHUB_HOSTED_EPHEMERAL_ONLY
        run: |
          sudo -n env CI="$CI" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            PEF_NETNS_ACK="$PEF_NETNS_ACK" PEF_NETNS_REPO_ROOT="$GITHUB_WORKSPACE" \
            PEF_NETNS_NODE="$(command -v node)" \
            PEF_NETNS_EVIDENCE="$RUNNER_TEMP/pef-netns-evidence.json" \
            PEF_NETNS_POLICY_EVIDENCE="$RUNNER_TEMP/pef-netns-policy.json" \
            bash scripts/lab/netns-smoke.sh
      - name: S3 cgroup and namespace workload isolation (ephemeral Linux)
        env:
          PEF_S3_ACK: GITHUB_HOSTED_EPHEMERAL_ONLY
        run: |
          sudo -n env CI="$CI" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            PEF_S3_ACK="$PEF_S3_ACK" PEF_S3_REPO_ROOT="$GITHUB_WORKSPACE" \
            PEF_S3_NODE="$(command -v node)" \
            PEF_S3_EVIDENCE="$RUNNER_TEMP/pef-s3-evidence.json" PEF_S34_EVIDENCE="$RUNNER_TEMP/pef-s34-evidence.json" \
            bash scripts/lab/workload-isolation-smoke.sh
      - name: Upload lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-netns-evidence
          path: |
            ${{ runner.temp }}/pef-netns-*.json
            ${{ runner.temp }}/pef-s3-evidence.json
            ${{ runner.temp }}/pef-s34-evidence.json
          if-no-files-found: warn

  prehardware-gate:
    name: Pre-hardware software handoff
    if: always()
    needs: [emulator, netns-lab]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download actual Linux lab artifacts
        if: ${{ needs.netns-lab.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pef-netns-evidence
          path: ${{ runner.temp }}/pef-lab-evidence
      - name: Evaluate fail-closed pre-hardware handoff
        env:
          PEF_EMULATOR_RESULT: ${{ needs.emulator.result }}
          PEF_LINUX_RESULT: ${{ needs.netns-lab.result }}
          PEF_LAB_EVIDENCE_DIR: ${{ runner.temp }}/pef-lab-evidence
        run: node bin/pef-prehardware-gate.js --output "$RUNNER_TEMP/pef-prehardware-gate.json"
      - name: Upload handoff verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pef-prehardware-gate
          path: ${{ runner.temp }}/pef-prehardware-gate.json
          if-no-files-found: warn
